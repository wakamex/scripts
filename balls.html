<html>
<head>
<style>
    #canvasWrapper {
        width: 800px;
        height: 800px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    /* Position canvases on top of each other */
    #backgroundCanvas, #matterCanvas, #uiCanvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    body {
        background-color: transparent;
    }
</style>
</head>
<body>
    <div id="background=" style="background-color: #1c2021 ; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        <div id="canvasWrapper">
            <canvas id="backgroundCanvas" width="800" height="800" style="z-index: -1;"></canvas>
            <canvas id="uiCanvas" width="800" height="800"></canvas>
        </div>
    </div>

    <script src="matter.min.js"></script>
    <script>
        function hexToRgba(hex, alpha) {
            var r = parseInt(hex.slice(1, 3), 16);
            var g = parseInt(hex.slice(3, 5), 16);
            var b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        var distFromCenter = 150;
        var homeRadius = 80;
        var transparency = 1;

        var bgCanvas = document.getElementById('backgroundCanvas');
        var bgContext = bgCanvas.getContext('2d');
        bgContext.fillStyle = '#FFF';
        bgContext.strokeStyle = '#FFF';
        bgContext.lineWidth = 10;

        var circles = [
            { x: 400 - distFromCenter, y: 400 - distFromCenter, color: hexToRgba("#1c0095", transparency), label: "Long" },
            { x: 400 + distFromCenter, y: 400 - distFromCenter, color: hexToRgba("#c54f23", transparency), label: "Short" },
            { x: 400, y: 400 + distFromCenter * Math.sqrt(2), color: hexToRgba("#359108", transparency), label: "LP" }
        ];
        var canvasCenterX = bgCanvas.width / 2;
        var canvasCenterY = bgCanvas.height / 2;

        // Black circle in the middle
        bgContext.beginPath();
        bgContext.arc(canvasCenterX, canvasCenterY, 37.5, 0, 2 * Math.PI);
        bgContext.fillStyle = '#000';
        bgContext.fill();

        circles.forEach(function(circle) {
            var dx = circle.x - canvasCenterX;
            var dy = circle.y - canvasCenterY;
            var angleToCenter = Math.atan2(dy, dx);

            // Adjust the start and end angles so that the empty part points toward the center
            var startAngle = angleToCenter - Math.PI * 0.75;
            var endAngle = angleToCenter + Math.PI * 0.75;

            // Thick line pointing to the center
            bgContext.beginPath();
            bgContext.moveTo(circle.x, circle.y);
            bgContext.lineTo(canvasCenterX, canvasCenterY);
            bgContext.strokeStyle = '#000';
            bgContext.lineWidth = 35;
            bgContext.stroke();

            // Draw the circle
            bgContext.beginPath();
            bgContext.arc(circle.x, circle.y, homeRadius, 0, 2 * Math.PI);
            bgContext.lineWidth = 10;
            bgContext.fillStyle = circle.color;
            bgContext.fill();

            // Draw the arc
            bgContext.beginPath();
            bgContext.strokeStyle = '#FFF';
            bgContext.arc(circle.x, circle.y, homeRadius*0.75, startAngle, endAngle);
            bgContext.stroke();
        });

        // Your existing imports and setup
        var Engine = Matter.Engine,
            Render = Matter.Render,
            Runner = Matter.Runner,
            Composites = Matter.Composites,
            Common = Matter.Common,
            MouseConstraint = Matter.MouseConstraint,
            Mouse = Matter.Mouse,
            Composite = Matter.Composite,
            Bodies = Matter.Bodies,
            Body = Matter.Body;
        
        // create an engine
        var engine = Engine.create(),
            world = engine.world;
        // Disable the default engine-wide gravity
        engine.gravity.y = 0;
        
        // create a renderer
        var render = Render.create({
            element: document.getElementById('canvasWrapper'),
            engine: engine,
            options: {
                width: 800,
                height: 800,
                wireframes: false,
                // showPerformance: true,
                // showStats: true,
                transparent: true,
                background: 'transparent',
                wireframes: false
            }
        });
        
        var long = Bodies.circle(400-distFromCenter, 400-distFromCenter, homeRadius, { render: { fillStyle: hexToRgba("#1c0095", transparency), }, isStatic: true, isSensor: true , label: "Long"});
        var short = Bodies.circle(400+distFromCenter, 400-distFromCenter, homeRadius, { render: { fillStyle: hexToRgba("#c54f23", transparency) }, isStatic: true, isSensor: true, label: "Short"});
        var lp = Bodies.circle(400, 400+distFromCenter*Math.sqrt(2), homeRadius, { render: { fillStyle: hexToRgba("#359108", transparency) }, isStatic: true, isSensor: true, label: "LP"});

        // Create three populations of balls
        var numBalls = 1, ballSize = 15, spaceBetween = 20;
        var widthOfStack = numBalls * (ballSize + spaceBetween);
        var xStart = (800 - widthOfStack) / 2;
        var yStart = (800 - widthOfStack) / 2;
        var stacks = [
            Composites.stack(xStart-141.4, yStart-141.4, numBalls, numBalls, spaceBetween, spaceBetween, function(x, y) {
                return Bodies.circle(x, y, ballSize, { render: { fillStyle: '#c54f23', strokeStyle: 'black', lineWidth: 3 } }); // orangered
            }),
            Composites.stack(xStart, yStart-200, numBalls, numBalls, spaceBetween, spaceBetween, function(x, y) {
                return Bodies.circle(x, y, ballSize, { render: { fillStyle: '#359108', strokeStyle: 'black', lineWidth: 3 } }); // green
            }),
            Composites.stack(xStart+141.4, yStart+141.4, numBalls, numBalls, spaceBetween, spaceBetween, function(x, y) {
                return Bodies.circle(x, y, ballSize, { render: { fillStyle: '#1c0095', strokeStyle: 'black', lineWidth: 3 } }); // blue
            })
        ];

        // Generate line segments to form a circular boundary
        var circleRadius = 400;  // Define the radius of your circle
        var circleCenter = { x: 400, y: 400 };  // Center of the circle
        var numberOfSegments = 100;  // The more segments, the smoother the circle
        var segmentLength = (2 * Math.PI * circleRadius) / numberOfSegments;

        var circularBoundary = Composite.create({ label: 'Circular Boundary' });

        for (var i = 0; i < numberOfSegments; i++) {
            var angle1 = (Math.PI * 2 * i) / numberOfSegments;
            var angle2 = (Math.PI * 2 * (i + 1)) / numberOfSegments;

            var x1 = circleCenter.x + circleRadius * Math.cos(angle1);
            var y1 = circleCenter.y + circleRadius * Math.sin(angle1);

            var x2 = circleCenter.x + circleRadius * Math.cos(angle2);
            var y2 = circleCenter.y + circleRadius * Math.sin(angle2);

            var boundarySegment = Bodies.rectangle(
                (x1 + x2) / 2,
                (y1 + y2) / 2,
                segmentLength,
                1,  // Width of each segment; can be adjusted
                {
                    angle: angle1 + Math.PI / 2,
                    isStatic: true
                }
            );

            Composite.add(circularBoundary, boundarySegment);
        }

        // Add stuff to the world
        Composite.add(world, circularBoundary); 
        Composite.add(world, stacks);

        // Custom update function to apply "gravity" forces
        (function update() {
            var centers = [  // Gravity centers
                { x: 800, y: 0 },  // for red balls
                { x: 400, y: 965.69 },  // for green balls
                { x: 0, y: 0 }   // for blue balls
            ];

            // Loop through each stack and apply forces
            stacks.forEach(function(stack, index) {
                var center = centers[index];
                for (var i = 0; i < stack.bodies.length; i++) {
                    var body = stack.bodies[i];
                    var dx = center.x - body.position.x;
                    var dy = center.y - body.position.y;
                    var distance = Math.sqrt(dx * dx + dy * dy);
                    var forceMagnitude = 0.0000000001 * body.mass * distance;

                    Body.applyForce(body, body.position, {
                        x: (center.x - body.position.x) * forceMagnitude,
                        y: (center.y - body.position.y) * forceMagnitude
                    });
                }
            });

            // Request next frame
            requestAnimationFrame(update);
        })();
        
        Render.run(render);  // run the renderer
        var runner = Runner.create();  // create runner
        Runner.run(runner, engine);  // run the engine

        // Function to add a new ball to one of the stacks
        function addRandomBall() {
            // Randomly select one of the three stacks (0, 1, or 2)
            var randomIndex = Math.floor(Math.random() * 3);
            var stack = stacks[randomIndex];
            var color;

            // Set the color based on the selected stack
            switch (randomIndex) {
                case 0:
                    color = '#c54f23';  // orangered shorts
                    break;
                case 1:
                    color = '#359108' ;  // green LPs
                    break;
                case 2:
                    color = '#1c0095';  // blue longs
                    break;
            }

            var numberOfBalls = stacks.reduce(function(acc, stack) {
                return acc + stack.bodies.length;
            }, 0);

            if (numberOfBalls > 100) {
                var randomIndexToRemove = Math.floor(Math.random() * 3);
                var stackToRemove = stacks[randomIndexToRemove];
                var bodyToRemove = stackToRemove.bodies[0];  // The oldest ball in the stack
                console.log("attempting to remove, # of bodies before: ", stackToRemove.bodies.length);
                Composite.remove(stackToRemove, bodyToRemove);
                Composite.remove(world, bodyToRemove);  // Remove from world too
                console.log("                      # of bodies after: ", stackToRemove.bodies.length);
            }

            // Create a new ball
            var newBall = Bodies.circle(
                200 + Math.random() * 400,  // Random x-coordinate
                200 + Math.random() * 400,  // Random y-coordinate
                ballSize,  // Radius
                { render: { fillStyle: color, strokeStyle: 'black', lineWidth: 3 } }  // Color
            );

            // Add the new ball to the selected stack and world
            Composite.add(stack, newBall);
            Composite.add(world, newBall);
        }

        setInterval(addRandomBall, 500);  // Add a new ball every 500 ms

        // Get a reference to the UI canvas and its context
        var uiCanvas = document.getElementById('uiCanvas');
        var uiContext = uiCanvas.getContext('2d');

        var labels = [long, short, lp];
        var canvasCenterX = uiCanvas.width / 2;
        var canvasCenterY = uiCanvas.height / 2;

        uiContext.font = '40px Arial';
        uiContext.fillStyle = '#000';
        uiContext.textAlign = 'center';

        labels.forEach(function(label) {
            uiContext.lineWidth = 10;
            uiContext.strokeStyle = '#FFF';
            uiContext.stroke();

            // Draw the label
            var xOffset = 0, yOffset = 10;
            uiContext.fillText(label.label, label.position.x+xOffset, label.position.y+yOffset);
        });
        </script>
</body>
</html>
